# Canonical deployment for Church.API → Azure App Service "mychurch"
# (+ optional Azure API Management import after a healthy deploy).
#
# ONLY this workflow must deploy production. Do not re-add an Azure Portal
# "Build and deploy ASP.Net Core app to Azure Web App - mychurch" workflow
# that runs `dotnet publish` without Church.API.csproj — that publishes
# Church.Tests/Church.DAL runtimeconfig files and Azure starts hostingstart.dll.

name: Deploy Church.API to Azure Web App mychurch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: mychurch
  AZURE_RESOURCE_GROUP: MyChurch
  DOTNET_VERSION: "10.x"
  CONFIGURATION: Release
  API_PROJECT: Church.API/Church.API.csproj
  TEST_PROJECT: Church.Tests/Church.Tests.csproj
  PUBLISH_DIR: ./publish
  AZURE_APIM_RESOURCE_PATH: /
  AZURE_APIM_RESOURCEGROUP: MyChurch
  AZURE_APIM_SERVICENAME: ChurchAPIapi
  AZURE_APIM_API_ID: ChurchAPI
  AZURE_APIM_APPSERVICEURL: https://mychurch-czdwf2enfdfrhchd.uaenorth-01.azurewebsites.net

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: |
          dotnet restore "${{ env.API_PROJECT }}"
          dotnet restore "${{ env.TEST_PROJECT }}"

      - name: Build
        run: |
          dotnet build "${{ env.API_PROJECT }}" \
            --configuration ${{ env.CONFIGURATION }} \
            --no-restore
          dotnet build "${{ env.TEST_PROJECT }}" \
            --configuration ${{ env.CONFIGURATION }} \
            --no-restore

      - name: Test
        run: |
          dotnet test "${{ env.TEST_PROJECT }}" \
            --configuration ${{ env.CONFIGURATION }} \
            --no-build \
            --verbosity normal

      - name: Publish Church.API only
        run: |
          set -euo pipefail
          rm -rf "${{ env.PUBLISH_DIR }}"
          # Publish the API project only — never Church.sln / Church.Tests.
          # Omit --no-build so publish uses a project-scoped output graph.
          dotnet publish "${{ env.API_PROJECT }}" \
            --configuration ${{ env.CONFIGURATION }} \
            --no-restore \
            --output "${{ env.PUBLISH_DIR }}"

      - name: Verify publish output is Church.API only
        run: |
          set -euo pipefail
          PUBLISH="${{ env.PUBLISH_DIR }}"
          echo "Publish directory contents:"
          ls -la "$PUBLISH"

          if [ ! -f "$PUBLISH/Church.API.dll" ]; then
            echo "::error::Missing Church.API.dll in publish output"
            exit 1
          fi
          if [ ! -f "$PUBLISH/Church.API.runtimeconfig.json" ]; then
            echo "::error::Missing Church.API.runtimeconfig.json in publish output"
            exit 1
          fi
          if [ ! -f "$PUBLISH/Church.API.deps.json" ]; then
            echo "::error::Missing Church.API.deps.json in publish output"
            exit 1
          fi
          if [ ! -f "$PUBLISH/Church.BLL.dll" ]; then
            echo "::error::Missing Church.BLL.dll (API dependency) in publish output"
            exit 1
          fi
          if [ ! -f "$PUBLISH/Church.DAL.dll" ]; then
            echo "::error::Missing Church.DAL.dll (API dependency) in publish output"
            exit 1
          fi

          # Azure Linux Oryx fails when multiple *.runtimeconfig.json files exist.
          if [ -f "$PUBLISH/Church.DAL.runtimeconfig.json" ]; then
            echo "::error::Church.DAL.runtimeconfig.json must not be in publish output (library, not startup app)"
            exit 1
          fi
          if [ -f "$PUBLISH/Church.Tests.runtimeconfig.json" ]; then
            echo "::error::Church.Tests.runtimeconfig.json must not be in publish output"
            exit 1
          fi
          if [ -f "$PUBLISH/Church.BLL.runtimeconfig.json" ]; then
            echo "::error::Church.BLL.runtimeconfig.json must not be in publish output"
            exit 1
          fi

          RUNTIMECONFIG_COUNT=$(find "$PUBLISH" -maxdepth 1 -name '*.runtimeconfig.json' | wc -l)
          echo "runtimeconfig.json count: $RUNTIMECONFIG_COUNT"
          if [ "$RUNTIMECONFIG_COUNT" -ne 1 ]; then
            echo "::error::Expected exactly 1 *.runtimeconfig.json (Church.API), found $RUNTIMECONFIG_COUNT:"
            find "$PUBLISH" -maxdepth 1 -name '*.runtimeconfig.json' -print
            exit 1
          fi

          echo "Publish verification succeeded (Church.API only)."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: church-api
          path: ${{ env.PUBLISH_DIR }}
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # Keep this environment — Azure federated credential subject is
    # repo:John19110/Church-management-system:environment:ChurchAPIapi_Env
    environment: ChurchAPIapi_Env

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: church-api
          path: ${{ env.PUBLISH_DIR }}

      - name: Verify downloaded package
        run: |
          set -euo pipefail
          PUBLISH="${{ env.PUBLISH_DIR }}"
          ls -la "$PUBLISH"
          test -f "$PUBLISH/Church.API.dll"
          test -f "$PUBLISH/Church.API.runtimeconfig.json"
          test ! -f "$PUBLISH/Church.DAL.runtimeconfig.json"
          test ! -f "$PUBLISH/Church.Tests.runtimeconfig.json"
          RUNTIMECONFIG_COUNT=$(find "$PUBLISH" -maxdepth 1 -name '*.runtimeconfig.json' | wc -l)
          test "$RUNTIMECONFIG_COUNT" -eq 1

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.ChurchAPIapi_CLIENT_ID_CD32 || secrets.AZUREAPPSERVICE_CLIENTID_CF03DC62A51A40DA900042651E7E2577 }}
          tenant-id: ${{ vars.ChurchAPIapi_TENANT_ID_CD32 || secrets.AZUREAPPSERVICE_TENANTID_F6F0D3BDF5604B7D8A08F66CB5A91DC0 }}
          subscription-id: ${{ vars.ChurchAPIapi_SUBSCRIPTION_ID_CD32 || secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_ABC8CF383D3C4FDFAB0A9B1F4A539513 }}

      - name: Set Azure App Service startup command
        run: |
          set -euo pipefail
          az webapp config set \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --startup-file "dotnet Church.API.dll"
          echo "Startup command set to: dotnet Church.API.dll"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ env.PUBLISH_DIR }}

      - name: Wait for app / Swagger document
        id: swagger
        continue-on-error: true
        run: |
          set -euo pipefail
          URL="${{ env.AZURE_APIM_APPSERVICEURL }}/swagger/v1/swagger.json"
          echo "Polling $URL"
          for i in $(seq 1 30); do
            if curl -fsSL "$URL" -o ./swagger.json; then
              echo "Downloaded OpenAPI document ($(wc -c < ./swagger.json) bytes)."
              head -c 200 ./swagger.json || true
              echo
              exit 0
            fi
            echo "Attempt $i failed; waiting 10s..."
            sleep 10
          done
          echo "Swagger document was not available after deploy. APIM import will be skipped."
          exit 1

      - name: Import API into Azure API Management
        if: steps.swagger.outcome == 'success'
        run: |
          set -euo pipefail
          az apim api import \
            --path "${{ env.AZURE_APIM_RESOURCE_PATH }}" \
            --resource-group "${{ env.AZURE_APIM_RESOURCEGROUP }}" \
            --service-name "${{ env.AZURE_APIM_SERVICENAME }}" \
            --api-id "${{ env.AZURE_APIM_API_ID }}" \
            --service-url "${{ env.AZURE_APIM_APPSERVICEURL }}" \
            --specification-path ./swagger.json \
            --specification-format OpenApi \
            --subscription-required false

      - name: Azure logout
        if: always()
        run: az logout || true
