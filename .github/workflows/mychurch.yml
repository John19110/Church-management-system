# Single production deploy: Church.API → Azure App Service "mychurch"
#
# Do NOT re-add the Azure Portal workflow that runs
#   dotnet publish -c Release
# without Church.API.csproj — that packs multiple *.runtimeconfig.json files
# and Azure starts hostingstart.dll instead of Church.API.dll.
#
# OIDC: Azure Portal federated credentials for this App Service are typically
# issued for branch subjects (ref:refs/heads/main), NOT GitHub Environments.
# Therefore this workflow must NOT set `environment: ChurchAPIapi_Env`.

name: Deploy Church.API to Azure Web App mychurch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: mychurch
  AZURE_RESOURCE_GROUP: MyChurch
  DOTNET_VERSION: "10.x"
  CONFIGURATION: Release
  API_PROJECT: Church.API/Church.API.csproj
  TEST_PROJECT: Church.Tests/Church.Tests.csproj
  PUBLISH_DIR: ./publish
  AZURE_APIM_RESOURCE_PATH: /
  AZURE_APIM_RESOURCEGROUP: MyChurch
  AZURE_APIM_SERVICENAME: ChurchAPIapi
  AZURE_APIM_API_ID: ChurchAPI
  AZURE_APIM_APPSERVICEURL: https://mychurch-czdwf2enfdfrhchd.uaenorth-01.azurewebsites.net

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: |
          dotnet restore "${{ env.API_PROJECT }}"
          dotnet restore "${{ env.TEST_PROJECT }}"

      - name: Build
        run: |
          dotnet build "${{ env.API_PROJECT }}" \
            --configuration ${{ env.CONFIGURATION }} \
            --no-restore
          dotnet build "${{ env.TEST_PROJECT }}" \
            --configuration ${{ env.CONFIGURATION }} \
            --no-restore

      - name: Test
        run: |
          dotnet test "${{ env.TEST_PROJECT }}" \
            --configuration ${{ env.CONFIGURATION }} \
            --no-build \
            --verbosity normal

      - name: Publish Church.API only
        run: |
          set -euo pipefail
          rm -rf "${{ env.PUBLISH_DIR }}"
          # Publish ONLY Church.API — never Church.sln / Church.Tests.
          dotnet publish "${{ env.API_PROJECT }}" \
            --configuration ${{ env.CONFIGURATION }} \
            --no-restore \
            --output "${{ env.PUBLISH_DIR }}"

      - name: Verify publish output is Church.API only
        run: |
          set -euo pipefail
          PUBLISH="${{ env.PUBLISH_DIR }}"
          echo "Publish directory contents:"
          find "$PUBLISH" -maxdepth 1 -type f -print | sort

          test -f "$PUBLISH/Church.API.dll"
          test -f "$PUBLISH/Church.API.runtimeconfig.json"
          test -f "$PUBLISH/Church.API.deps.json"
          test -f "$PUBLISH/Church.BLL.dll"
          test -f "$PUBLISH/Church.DAL.dll"

          echo "All runtimeconfig files:"
          find "$PUBLISH" -name "*.runtimeconfig.json" -print

          test ! -f "$PUBLISH/Church.DAL.runtimeconfig.json"
          test ! -f "$PUBLISH/Church.Tests.runtimeconfig.json"
          test ! -f "$PUBLISH/Church.BLL.runtimeconfig.json"

          RUNTIMECONFIG_COUNT=$(find "$PUBLISH" -maxdepth 1 -name '*.runtimeconfig.json' | wc -l)
          echo "runtimeconfig.json count: $RUNTIMECONFIG_COUNT"
          if [ "$RUNTIMECONFIG_COUNT" -ne 1 ]; then
            echo "::error::Expected exactly 1 *.runtimeconfig.json (Church.API), found $RUNTIMECONFIG_COUNT"
            exit 1
          fi

          echo "Publish verification succeeded (Church.API only)."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: church-api
          path: ${{ env.PUBLISH_DIR }}
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # Intentionally NO GitHub Environment.
    # OIDC subject must be:
    #   repo:John19110/Church-management-system:ref:refs/heads/main
    # which matches the Azure Portal–created federated credential.
    # Using environment:ChurchAPIapi_Env caused AADSTS700213.

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: church-api
          path: ${{ env.PUBLISH_DIR }}

      - name: Verify downloaded package
        run: |
          set -euo pipefail
          PUBLISH="${{ env.PUBLISH_DIR }}"
          find "$PUBLISH" -maxdepth 1 -type f -print | sort
          test -f "$PUBLISH/Church.API.dll"
          test -f "$PUBLISH/Church.API.runtimeconfig.json"
          test ! -f "$PUBLISH/Church.DAL.runtimeconfig.json"
          test ! -f "$PUBLISH/Church.Tests.runtimeconfig.json"
          RUNTIMECONFIG_COUNT=$(find "$PUBLISH" -maxdepth 1 -name '*.runtimeconfig.json' | wc -l)
          test "$RUNTIMECONFIG_COUNT" -eq 1

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          # Use the App Service deployment identity created by Azure Portal
          # (same secret names as the auto-generated workflow). Do not mix with
          # ChurchAPIapi_* vars from a different federated credential.
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C2F3EDE1DD0E4328B98C9BC85E3779F7 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9BB3C2D3F2C242F598E9DB8960A1D16C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C09AEA0595B84DA7B3FF1F55F217576B }}

      - name: Set Azure App Service startup command
        run: |
          set -euo pipefail
          az webapp config set \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --startup-file "dotnet Church.API.dll"
          echo "Startup command set to: dotnet Church.API.dll"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ env.PUBLISH_DIR }}

      - name: Wait for app / Swagger document
        id: swagger
        continue-on-error: true
        run: |
          set -euo pipefail
          URL="${{ env.AZURE_APIM_APPSERVICEURL }}/swagger/v1/swagger.json"
          echo "Polling $URL"
          for i in $(seq 1 30); do
            if curl -fsSL "$URL" -o ./swagger.json; then
              echo "Downloaded OpenAPI document ($(wc -c < ./swagger.json) bytes)."
              head -c 200 ./swagger.json || true
              echo
              exit 0
            fi
            echo "Attempt $i failed; waiting 10s..."
            sleep 10
          done
          echo "Swagger document was not available after deploy. APIM import will be skipped."
          exit 1

      - name: Import API into Azure API Management
        if: steps.swagger.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          az apim api import \
            --path "${{ env.AZURE_APIM_RESOURCE_PATH }}" \
            --resource-group "${{ env.AZURE_APIM_RESOURCEGROUP }}" \
            --service-name "${{ env.AZURE_APIM_SERVICENAME }}" \
            --api-id "${{ env.AZURE_APIM_API_ID }}" \
            --service-url "${{ env.AZURE_APIM_APPSERVICEURL }}" \
            --specification-path ./swagger.json \
            --specification-format OpenApi \
            --subscription-required false

      - name: Azure logout
        if: always()
        run: az logout || true
