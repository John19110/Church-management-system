# Single authoritative production deploy: Church.API -> Azure App Service "mychurchwebapp".
#
# Replaces the previous workflow that deployed to the old App Service "mychurch"
# (UAE North). The old service is intentionally left running as a fallback but no
# longer receives deployments.
#
# Do NOT change the publish step to a bare `dotnet publish -c Release` from the repo
# root. That packs several *.runtimeconfig.json files and Azure then starts
# hostingstart.dll instead of Church.API.dll. The publish verification step below
# exists to catch exactly that regression.
#
# OIDC: deployment uses the dedicated user-assigned managed identity
# "mychurchwebapp-deploy" (resource group mychurchwebapp_group), which holds
# "Website Contributor" scoped to this App Service only. Its federated credential is
# issued for the branch subject (repo:<owner>/<repo>:ref:refs/heads/main), NOT for a
# GitHub Environment, so this workflow must not set `environment:` — doing so
# previously caused AADSTS700213.
#
# The legacy oidc-msi-* identities created by the old app's Deployment Center are
# deliberately NOT used here; they were shared across deployments and could not be
# told apart from one another.

name: Deploy MyChurch API to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: mychurchwebapp
  AZURE_RESOURCE_GROUP: mychurchwebapp_group
  AZURE_WEBAPP_HOSTNAME: mychurchwebapp-cdfpdedgfdd7cqhb.germanywestcentral-01.azurewebsites.net
  DOTNET_VERSION: "10.x"
  CONFIGURATION: Release
  API_PROJECT: Church.API/Church.API.csproj
  TEST_PROJECT: Church.Tests/Church.Tests.csproj
  PUBLISH_DIR: ./publish
  # Exact Flutter Web origins (Firebase Hosting serves the app on both domains).
  # Not secrets — these are public origins and must match the browser's Origin header exactly.
  CORS_ALLOWED_ORIGIN_0: https://my-church-e838a.web.app
  CORS_ALLOWED_ORIGIN_1: https://my-church-e838a.firebaseapp.com

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: |
          dotnet restore "${{ env.API_PROJECT }}"
          dotnet restore "${{ env.TEST_PROJECT }}"

      - name: Build
        run: |
          dotnet build "${{ env.API_PROJECT }}" \
            --configuration ${{ env.CONFIGURATION }} \
            --no-restore
          dotnet build "${{ env.TEST_PROJECT }}" \
            --configuration ${{ env.CONFIGURATION }} \
            --no-restore

      - name: Test
        run: |
          dotnet test "${{ env.TEST_PROJECT }}" \
            --configuration ${{ env.CONFIGURATION }} \
            --no-build \
            --verbosity normal

      - name: Publish Church.API only
        run: |
          set -euo pipefail
          rm -rf "${{ env.PUBLISH_DIR }}"
          # Publish ONLY Church.API — never Church.sln / Church.Tests.
          dotnet publish "${{ env.API_PROJECT }}" \
            --configuration ${{ env.CONFIGURATION }} \
            --output "${{ env.PUBLISH_DIR }}"

      - name: Verify publish output is Church.API only
        run: |
          set -euo pipefail
          PUBLISH="${{ env.PUBLISH_DIR }}"
          echo "Publish directory contents:"
          find "$PUBLISH" -maxdepth 1 -type f -print | sort

          test -f "$PUBLISH/Church.API.dll"
          test -f "$PUBLISH/Church.API.runtimeconfig.json"
          test -f "$PUBLISH/Church.API.deps.json"
          test -f "$PUBLISH/Church.BLL.dll"
          test -f "$PUBLISH/Church.DAL.dll"

          test ! -f "$PUBLISH/Church.DAL.runtimeconfig.json"
          test ! -f "$PUBLISH/Church.Tests.runtimeconfig.json"
          test ! -f "$PUBLISH/Church.BLL.runtimeconfig.json"

          RUNTIMECONFIG_COUNT=$(find "$PUBLISH" -maxdepth 1 -name '*.runtimeconfig.json' | wc -l)
          echo "runtimeconfig.json count: $RUNTIMECONFIG_COUNT"
          if [ "$RUNTIMECONFIG_COUNT" -ne 1 ]; then
            echo "::error::Expected exactly 1 *.runtimeconfig.json (Church.API), found $RUNTIMECONFIG_COUNT"
            exit 1
          fi

          # Production secrets live in Azure App Settings. appsettings.Production.json is
          # gitignored, so it must never appear in the deployment package.
          if [ -f "$PUBLISH/appsettings.Production.json" ]; then
            echo "::error::appsettings.Production.json must not be deployed; it holds secrets and is gitignored."
            exit 1
          fi

          echo "Publish verification succeeded (Church.API only)."

      - name: Create deployment zip
        run: |
          set -euo pipefail
          cd "${{ env.PUBLISH_DIR }}"
          zip -r ../church-api.zip .
          cd ..
          ls -la church-api.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: church-api
          path: church-api.zip
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # Intentionally NO GitHub Environment — see the OIDC note at the top of this file.

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: church-api
          path: .

      - name: Verify downloaded package
        run: |
          set -euo pipefail
          unzip -l church-api.zip | head -n 40
          test -f church-api.zip
          unzip -p church-api.zip Church.API.dll > /dev/null
          unzip -p church-api.zip Church.BLL.dll > /dev/null
          unzip -p church-api.zip Church.DAL.dll > /dev/null
          RUNTIMECONFIG_COUNT=$(unzip -l church-api.zip | awk '/runtimeconfig.json$/ {count++} END {print count+0}')
          echo "runtimeconfig.json count: $RUNTIMECONFIG_COUNT"
          test "$RUNTIMECONFIG_COUNT" -eq 1

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set Azure App Service startup command
        run: |
          set -euo pipefail
          az webapp config set \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --startup-file "dotnet Church.API.dll" \
            --output none
          echo "Startup command set to: dotnet Church.API.dll"

      - name: Ensure required App Settings
        run: |
          set -euo pipefail
          # appsettings.Production.json is gitignored, so it never reaches CI and is not in the
          # published zip. Without Cors__AllowedOrigins the API fails fast at startup with
          # "Missing required configuration 'Cors:AllowedOrigins'" and the container aborts.
          # `appsettings set` merges, so SecretKey / ConnectionStrings__cs stay untouched.
          # --output none keeps the command from echoing every app setting into the build log.
          az webapp config appsettings set \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --settings \
              "ASPNETCORE_ENVIRONMENT=Production" \
              "Cors__AllowedOrigins__0=${{ env.CORS_ALLOWED_ORIGIN_0 }}" \
              "Cors__AllowedOrigins__1=${{ env.CORS_ALLOWED_ORIGIN_1 }}" \
            --output none
          echo "Ensured ASPNETCORE_ENVIRONMENT and Cors__AllowedOrigins__0/__1 on ${{ env.AZURE_WEBAPP_NAME }}."

      - name: Deploy to Azure Web App
        run: |
          set -euo pipefail
          az webapp deploy \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --src-path church-api.zip \
            --type zip \
            --clean true \
            --restart true \
            --timeout 600000

      - name: Smoke test
        run: |
          set -euo pipefail
          # Swagger is disabled in Production on purpose, so it cannot be used as a readiness
          # probe. GET / is anonymous and returns 204 when Swagger is off (200 otherwise),
          # which proves the container started and the ASP.NET pipeline is serving requests.
          URL="https://${{ env.AZURE_WEBAPP_HOSTNAME }}/"
          echo "Polling $URL"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$URL" || echo "000")
            if [ "$CODE" = "204" ] || [ "$CODE" = "200" ]; then
              echo "API is up (HTTP $CODE)."
              exit 0
            fi
            echo "Attempt $i: HTTP $CODE; waiting 10s..."
            sleep 10
          done
          echo "::error::API did not become healthy after deploy."
          exit 1

      - name: Verify CORS preflight for Flutter Web origin
        run: |
          set -euo pipefail
          URL="https://${{ env.AZURE_WEBAPP_HOSTNAME }}/api/Account/login"
          ALLOW=$(curl -s -i -X OPTIONS "$URL" \
            -H "Origin: ${{ env.CORS_ALLOWED_ORIGIN_0 }}" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type" \
            --max-time 30 | tr -d '\r' | grep -i '^access-control-allow-origin:' || true)
          echo "Preflight response header: ${ALLOW:-<none>}"
          if [ -z "$ALLOW" ]; then
            echo "::error::No Access-Control-Allow-Origin returned for ${{ env.CORS_ALLOWED_ORIGIN_0 }}."
            exit 1
          fi

      - name: Azure logout
        if: always()
        run: az logout || true
